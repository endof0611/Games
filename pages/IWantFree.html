<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>겨리 - 엄마 몰래 자유를 찾아서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  @font-face { font-family: Galmuri9; font-style: normal; font-weight: 400; font-display: swap; src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri9.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0a14; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
  @supports (height: 100dvh) { body { min-height: 100dvh; } }
  .frame { width: min(100%, 480px, calc((100vh - 56px) * 0.8)); margin: 0 auto; }
  @supports (height: 100dvh) { .frame { width: min(100%, 480px, calc((100dvh - 56px) * 0.8)); } }
  #root { width: 100%; max-width: 480px; margin: 0 auto; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  @keyframes cloudMove { 0%{transform:translateX(0)} 100%{transform:translateX(560px)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
// ⏱ 일시정지 가능한 타이머 (이 스크립트 안의 setTimeout/setInterval만 대상)
const Clock=(()=>{
  const real={st:window.setTimeout.bind(window),ct:window.clearTimeout.bind(window),si:window.setInterval.bind(window),ci:window.clearInterval.bind(window)};
  const items=new Map();let nid=1,paused=false;
  const arm=it=>{
    if(it.once){it.start=performance.now();it.h=real.st(()=>{items.delete(it.id);it.fn(...it.args);},it.rem);}
    else it.h=real.si(()=>it.fn(...it.args),it.ms);
  };
  const add=once=>(fn,ms=0,...args)=>{const it={id:nid++,once,fn,ms,rem:ms,args};items.set(it.id,it);if(!paused)arm(it);return it.id;};
  const del=id=>{const it=items.get(id);if(!it)return;(it.once?real.ct:real.ci)(it.h);items.delete(id);};
  return {
    setTimeout:add(true),setInterval:add(false),clearTimeout:del,clearInterval:del,
    pause(){if(paused)return;paused=true;items.forEach(it=>{if(it.once){real.ct(it.h);it.rem=Math.max(0,it.rem-(performance.now()-it.start));}else real.ci(it.h);});},
    resume(){if(!paused)return;paused=false;items.forEach(arm);}
  };
})();
const {setTimeout,setInterval,clearTimeout,clearInterval}=Clock;
// 💾 기록 저장 (localStorage 실패해도 게임은 동작)
const Store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(err){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(err){}}
};
const e = React.createElement;
const {useState, useEffect, useCallback, useRef} = React;

const GAME_W = 480, GAME_H = 600;
const PF = "'Press Start 2P','Galmuri9',monospace";
const C = {
  bg:"#1a1028", bgLight:"#2d1f42", accent:"#ffcc00", danger:"#ff4466",
  safe:"#44ffaa", mom:"#ff6b9d", kid:"#66ccff", white:"#fff", dark:"#0d0a14",
  fridge:"#a8d8ea", floor:"#3d2e5c", street:"#555566"
};

// ═══════════════════════════════════════
// 🔊 SOUND ENGINE (Web Audio API)
// ═══════════════════════════════════════
const SFX = (() => {
  let ctx = null;
  let muted = false;
  const getCtx = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  const play = (fn) => { if (muted) return; try { fn(getCtx()); } catch(e){} };

  // Helper: simple tone
  const tone = (c, freq, dur, type='square', vol=0.12) => {
    if (muted) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  };

  // Helper: noise burst (백색소음 버퍼는 한 번만 만들어 재사용)
  let noiseBuf = null;
  const noise = (c, dur, vol=0.08) => {
    if (muted) return;
    if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
      noiseBuf = c.createBuffer(1, Math.ceil(c.sampleRate * 1.5), c.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource();
    const g = c.createGain();
    src.buffer = noiseBuf;
    g.gain.setValueAtTime(vol * vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    src.connect(g); g.connect(c.destination);
    src.start(c.currentTime, Math.random() * (1.5 - dur), dur);
  };

  return {
    setMuted: (m) => { muted = m; },
    // 🛏️ 코골이
    snore: () => play(c => {
      const o = c.createOscillator(); const g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = 80;
      o.frequency.linearRampToValueAtTime(60, c.currentTime + 0.4);
      o.frequency.linearRampToValueAtTime(90, c.currentTime + 0.8);
      g.gain.setValueAtTime(0.06, c.currentTime);
      g.gain.linearRampToValueAtTime(0.1, c.currentTime + 0.3);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.8);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.8);
    }),

    // 살금살금 발소리
    sneak: () => play(c => {
      noise(c, 0.06, 0.04);
      tone(c, 200, 0.05, 'sine', 0.03);
    }),

    // ❗ 엄마 뒤척임 경고
    alert: () => play(c => {
      tone(c, 440, 0.1, 'square', 0.15);
      setTimeout(() => tone(c, 550, 0.1, 'square', 0.15), 100);
    }),

    // 📢 카카오톡 알림
    kakao: () => play(c => {
      tone(c, 880, 0.08, 'sine', 0.2);
      setTimeout(() => tone(c, 1100, 0.08, 'sine', 0.2), 80);
      setTimeout(() => tone(c, 1320, 0.12, 'sine', 0.25), 160);
    }),

    // 🔇 무음 버튼 탭
    muteTap: () => play(c => {
      tone(c, 600, 0.04, 'square', 0.08);
    }),

    // 🔕 무음 성공
    muteSuccess: () => play(c => {
      tone(c, 500, 0.1, 'sine', 0.12);
      setTimeout(() => tone(c, 700, 0.1, 'sine', 0.12), 100);
      setTimeout(() => tone(c, 1000, 0.2, 'sine', 0.15), 200);
    }),

    // 🧊 냉장고 여는 소리
    fridgeCreak: () => play(c => {
      const o = c.createOscillator(); const g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = 150;
      o.frequency.linearRampToValueAtTime(300, c.currentTime + 0.15);
      o.frequency.linearRampToValueAtTime(100, c.currentTime + 0.3);
      g.gain.setValueAtTime(0.04, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.3);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.3);
    }),

    // 🏃 점프
    jump: () => play(c => {
      const o = c.createOscillator(); const g = c.createGain();
      o.type = 'sine'; o.frequency.value = 300;
      o.frequency.exponentialRampToValueAtTime(600, c.currentTime + 0.15);
      g.gain.setValueAtTime(0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.2);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.2);
    }),

    // 💥 충돌
    crash: () => play(c => {
      noise(c, 0.3, 0.2);
      tone(c, 150, 0.2, 'sawtooth', 0.15);
    }),

    // 📱 폰 탭 (게임)
    phoneTap: () => play(c => {
      tone(c, 800 + Math.random() * 400, 0.03, 'sine', 0.06);
    }),

    // 👣 발소리 (level 4)
    footstep: () => play(c => {
      noise(c, 0.08, 0.06);
      tone(c, 100 + Math.random() * 40, 0.08, 'sine', 0.04);
    }),

    // 📱→🍑 폰 숨기기 탭
    hideTap: () => play(c => {
      tone(c, 400 + Math.random() * 200, 0.04, 'square', 0.08);
    }),

    // 👀 눈 흔들림
    eyeShake: () => play(c => {
      tone(c, 250, 0.06, 'sawtooth', 0.1);
    }),

    // ⭐ 스테이지 클리어
    stageClear: () => play(c => {
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => {
        setTimeout(() => tone(c, f, 0.2, 'sine', 0.15), i * 120);
      });
    }),

    // 😱 게임 오버
    gameOver: () => play(c => {
      tone(c, 400, 0.2, 'square', 0.15);
      setTimeout(() => tone(c, 300, 0.2, 'square', 0.15), 200);
      setTimeout(() => tone(c, 200, 0.4, 'sawtooth', 0.12), 400);
    }),

    // 🎮 UI 버튼 클릭
    click: () => play(c => {
      tone(c, 660, 0.05, 'square', 0.1);
    }),

    // 🏆 엔딩 팡파레
    fanfare: () => play(c => {
      const notes = [523, 523, 523, 659, 784, 784, 659, 784, 1047];
      const durs = [0.1, 0.1, 0.2, 0.2, 0.15, 0.15, 0.15, 0.15, 0.4];
      let t = 0;
      notes.forEach((f, i) => {
        setTimeout(() => tone(c, f, durs[i] + 0.1, 'sine', 0.15), t);
        t += durs[i] * 1000;
      });
    }),
  };
})();

// ─── TITLE ───
function TitleScreen({onStart,stats}) {
  const [blink, setBlink] = useState(true);
  useEffect(() => { const i=setInterval(()=>setBlink(b=>!b),600); return ()=>clearInterval(i); }, []);

  return e('div', {style:{width:'100%',height:'100%',background:`radial-gradient(ellipse at 50% 80%,${C.bgLight},${C.bg})`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,position:'relative',overflow:'hidden'}},
    e('div',{style:{position:'absolute',top:0,left:0,right:0,bottom:0,background:'repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.08) 3px,rgba(0,0,0,0.08) 4px)',pointerEvents:'none'}}),
    e('div',{style:{fontSize:52,marginBottom:4}},'🏠'),
    e('div',{style:{fontFamily:PF,fontSize:15,color:C.accent,textAlign:'center',lineHeight:1.8,textShadow:'2px 2px 0 #000, 0 0 20px rgba(255,204,0,0.4)',letterSpacing:1}},'엄마 몰래'),
    e('div',{style:{fontFamily:PF,fontSize:22,color:C.white,textAlign:'center',lineHeight:1.6,textShadow:'3px 3px 0 #000, 0 0 30px rgba(255,255,255,0.2)'}},'자유를 찾아서'),
    e('div',{style:{fontFamily:PF,fontSize:8,color:C.mom,marginTop:4,textShadow:'1px 1px 0 #000'}},'⚠️ 겨리의 잔소리 회피 시뮬레이터 ⚠️'),
    e('div',{style:{display:'flex',gap:18,marginTop:10,fontSize:32}},
      e('span',{style:{animation:'float 2s ease-in-out infinite'}},'📱'),
      e('span',{style:{animation:'float 2s ease-in-out infinite 0.3s'}},'🍦'),
      e('span',{style:{animation:'float 2s ease-in-out infinite 0.6s'}},'🛹'),
      e('span',{style:{animation:'float 2s ease-in-out infinite 0.9s'}},'📖'),
    ),
    stats&&(stats.fails+stats.best+stats.clears>0)?e('div',{style:{fontFamily:PF,fontSize:7,color:C.safe,marginTop:16,lineHeight:2,textAlign:'center'}},`🏅 최고 LEVEL ${stats.best} · 😱 들킨 횟수 ${stats.fails} · 🏆 올클리어 ${stats.clears}`):null,
    e('button',{onClick:()=>{SFX.click();onStart();},style:{marginTop:stats&&(stats.fails+stats.best+stats.clears>0)?14:28,fontFamily:PF,fontSize:11,padding:'14px 36px',background:blink?`linear-gradient(135deg,${C.accent},#ff9900)`:`linear-gradient(135deg,#ff9900,${C.accent})`,color:C.dark,border:'3px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'4px 4px 0 #000',transition:'all 0.15s',transform:blink?'scale(1)':'scale(1.05)'}},'게임 시작!'),
    e('div',{style:{fontFamily:PF,fontSize:7,color:'rgba(255,255,255,0.35)',marginTop:16}},'TAP / CLICK to play')
  );
}

// ─── LEVEL INTRO ───
function LevelIntro({level,title,desc,emoji,onStart}) {
  return e('div',{style:{width:'100%',height:'100%',background:`radial-gradient(circle at 50% 50%,${C.bgLight},${C.bg})`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:30}},
    e('div',{style:{fontFamily:PF,fontSize:10,color:C.accent,textShadow:'1px 1px 0 #000'}},`LEVEL ${level}`),
    e('div',{style:{fontSize:56,margin:'8px 0'}},emoji),
    e('div',{style:{fontFamily:PF,fontSize:13,color:C.white,textShadow:'2px 2px 0 #000',textAlign:'center'}},title),
    e('div',{style:{fontFamily:PF,fontSize:7,color:'rgba(255,255,255,0.6)',textAlign:'center',lineHeight:2.2,maxWidth:350,marginTop:8,whiteSpace:'pre-line'}},desc),
    e('button',{onClick:()=>{SFX.click();onStart();},style:{marginTop:22,fontFamily:PF,fontSize:10,padding:'12px 32px',background:`linear-gradient(135deg,${C.safe},#22cc88)`,color:C.dark,border:'3px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'3px 3px 0 #000'}},'도전!')
  );
}

// ─── LEVEL CLEAR ───
function LevelClear({level,onNext}) {
  const msgs=["겨리 스마트폰 획득! 🎉","겨리 아이스크림 GET! 🍦","겨리 무사히 탈출! 🏃","겨리 완벽한 알리바이! 😎","겨리 야식 라면 완성! 🍜","겨리 주술회전 30권 책장 완성! 📚","생일 서프라이즈 대성공! 🎂"];
  return e('div',{style:{width:'100%',height:'100%',background:`radial-gradient(circle at 50% 40%,#1a3a2a,${C.bg})`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}},
    e('div',{style:{fontSize:60,animation:'float 1s ease-in-out infinite'}},'⭐'),
    e('div',{style:{fontFamily:PF,fontSize:13,color:C.safe,textShadow:'2px 2px 0 #000'}},'STAGE CLEAR!'),
    e('div',{style:{fontFamily:PF,fontSize:9,color:C.accent,textShadow:'1px 1px 0 #000'}},msgs[level-1]),
    e('button',{onClick:()=>{SFX.click();onNext();},style:{marginTop:20,fontFamily:PF,fontSize:10,padding:'12px 32px',background:`linear-gradient(135deg,${C.accent},#ff9900)`,color:C.dark,border:'3px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'3px 3px 0 #000'}},level<7?'다음 스테이지 →':'엔딩 보기')
  );
}

// ─── GAME OVER ───
function GameOver({reason,quote,onRetry}) {
  return e('div',{style:{width:'100%',height:'100%',background:`radial-gradient(circle at 50% 40%,#3a1a1a,${C.bg})`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14}},
    e('div',{style:{fontSize:56}},'😱'),
    e('div',{style:{fontFamily:PF,fontSize:14,color:C.danger,textShadow:'2px 2px 0 #000'}},'들켰다!'),
    e('div',{style:{fontFamily:PF,fontSize:8,color:'rgba(255,255,255,0.6)',textAlign:'center',lineHeight:2,maxWidth:320,padding:'0 20px',whiteSpace:'pre-line'}},reason),
    e('div',{style:{fontFamily:PF,fontSize:8,color:C.mom,marginTop:4,textShadow:'1px 1px 0 #000',textAlign:'center',lineHeight:2.2}},quote||'엄마: "겨리 너 이리 와봐!!!"'),
    e('button',{onClick:()=>{SFX.click();onRetry();},style:{marginTop:18,fontFamily:PF,fontSize:10,padding:'12px 32px',background:`linear-gradient(135deg,${C.danger},#cc2244)`,color:C.white,border:'3px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'3px 3px 0 #000'}},'다시 도전!')
  );
}

// ═══════════════════════════════════════
// LEVEL 1: 안방 - 스마트폰 서리 작전
// ═══════════════════════════════════════
function Level1({onClear,onFail}) {
  const [phase,setPhase]=useState("sneak");
  const [playerX,setPlayerX]=useState(60);
  const phoneX=380;
  const [snoring,setSnoring]=useState(true);
  const [momEmoji,setMomEmoji]=useState("😴");
  const [snoreText,setSnoreText]=useState("드르렁~");
  const [muteGauge,setMuteGauge]=useState(0);
  const [kakaoTimer,setKakaoTimer]=useState(100);
  const [moving,setMoving]=useState(false);
  const caught=useRef(false);
  const xRef=useRef(60),gaugeRef=useRef(0),kakaoRef=useRef(100),doneRef=useRef(false);

  useEffect(()=>{
    if(phase!=="sneak")return;
    let t,snoreRepeat;
    const cycle=()=>{
      setSnoring(true);setSnoreText("드르렁~");setMomEmoji("😴");SFX.snore();
      clearInterval(snoreRepeat);
      snoreRepeat=setInterval(()=>SFX.snore(),900);
      const sd=2000+Math.random()*2500;
      t=setTimeout(()=>{
        clearInterval(snoreRepeat);
        setSnoring(false);setSnoreText("음..?!");setMomEmoji("😳");SFX.alert();
        const ad=1200+Math.random()*1000;
        t=setTimeout(()=>cycle(),ad);
      },sd);
    };
    cycle();
    return ()=>{clearTimeout(t);clearInterval(snoreRepeat);};
  },[phase]);

  useEffect(()=>{
    if(!snoring&&moving&&phase==="sneak"&&!caught.current){
      caught.current=true;
      onFail("움직이다가 엄마한테 들켰다!\n엄마가 깨지 않을 때만 움직여야 해!");
    }
  },[snoring,moving,phase]);

  const handleMove=useCallback(()=>{
    if(phase==="sneak"&&snoring){
      SFX.sneak();
      setMoving(true);
      const nx=Math.min(xRef.current+14,phoneX);xRef.current=nx;setPlayerX(nx);
      if(nx>=phoneX)setPhase("kakao");
      setTimeout(()=>setMoving(false),150);
    } else if(phase==="mute"){
      SFX.muteTap();
      const ng=Math.min(gaugeRef.current+8,100);gaugeRef.current=ng;setMuteGauge(ng);
      if(ng>=100&&!doneRef.current){doneRef.current=true;SFX.muteSuccess();setTimeout(()=>onClear(),300);}
    }
  },[phase,snoring,onClear]);

  useEffect(()=>{
    if(phase!=="kakao")return;
    SFX.kakao();
    const t=setTimeout(()=>setPhase("mute"),800);
    return ()=>clearTimeout(t);
  },[phase]);

  useEffect(()=>{
    if(phase!=="mute")return;
    const i=setInterval(()=>{
      if(doneRef.current)return;
      const nt=kakaoRef.current-2;kakaoRef.current=nt;setKakaoTimer(Math.max(nt,0));
      if(nt<=0){doneRef.current=true;onFail("\"카톡!\" 알림을 못 끄고 엄마가 깨버렸다!\n더 빨리 무음 버튼을 눌러야 해!");}
    },50);
    return ()=>clearInterval(i);
  },[phase,onFail]);

  const progress=(playerX-60)/(phoneX-60);

  return e('div',{style:{width:'100%',height:'100%',background:'linear-gradient(180deg,#0d0820 0%,#1a1040 40%,#251848 100%)',position:'relative',overflow:'hidden',cursor:'pointer',userSelect:'none'},onClick:handleMove},
    e('div',{style:{position:'absolute',inset:0,background:'repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 3px)',pointerEvents:'none',zIndex:20}}),
    // HUD
    e('div',{style:{position:'absolute',top:8,left:10,right:10,fontFamily:PF,fontSize:8,color:C.accent,zIndex:15,display:'flex',justifyContent:'space-between'}},
      e('span',null,'LEVEL 1: 안방'),e('span',null,'🎯 스마트폰 서리 작전')
    ),
    // Floor
    e('div',{style:{position:'absolute',bottom:0,left:0,right:0,height:260,background:`linear-gradient(180deg,${C.floor} 0%,#2a1e44 100%)`,borderTop:'3px solid rgba(255,255,255,0.1)'}}),
    // Bed
    e('div',{style:{position:'absolute',right:20,bottom:200,width:140,height:70,background:'linear-gradient(135deg,#8866aa,#665588)',borderRadius:'8px 8px 4px 4px',border:'2px solid #554477',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}},
      e('span',{style:{fontSize:36}},momEmoji),

    ),
    // Blanket
    e('div',{style:{position:'absolute',right:18,bottom:180,width:144,height:30,background:'repeating-linear-gradient(90deg,#9977bb 0px,#9977bb 12px,#8866aa 12px,#8866aa 24px)',borderRadius:'0 0 6px 6px',border:'2px solid #7755aa',borderTop:'none'}}),
    // Phone
    e('div',{style:{position:'absolute',left:phoneX-10,bottom:235,width:24,height:38,background:phase==="kakao"?C.accent:'linear-gradient(180deg,#333,#222)',borderRadius:4,border:`2px solid ${phase==="kakao"?"#fff":"#555"}`,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:phase==="kakao"?'0 0 20px rgba(255,204,0,0.8)':'none',animation:phase==="kakao"?'pulse 0.2s infinite':'none'}},
      e('span',{style:{fontSize:12}},'📱')
    ),
    // Nightstand
    e('div',{style:{position:'absolute',left:phoneX-24,bottom:195,width:52,height:40,background:'linear-gradient(180deg,#5a4a3a,#4a3a2a)',borderRadius:'3px 3px 0 0',border:'2px solid #3a2a1a'}}),
    // Player
    e('div',{style:{position:'absolute',left:playerX-16,bottom:195,transition:'left 0.15s',display:'flex',flexDirection:'column',alignItems:'center'}},
      e('span',{style:{fontSize:36,filter:moving?'brightness(1.3)':'none'}},'🧒'),
      phase==="sneak"?e('div',{style:{fontFamily:PF,fontSize:6,color:'rgba(255,255,255,0.4)',marginTop:2}},'겨리 살금살금...'):null
    ),
    // Kakao popup
    phase==="kakao"?e('div',{style:{position:'absolute',top:'40%',left:'50%',transform:'translate(-50%,-50%)',background:'#ffe812',padding:'16px 28px',borderRadius:12,fontFamily:PF,fontSize:13,color:'#3c1e1e',zIndex:30,boxShadow:'0 0 40px rgba(255,232,18,0.6), 4px 4px 0 #000',textAlign:'center',animation:'pulse 0.15s infinite'}},'📢 카톡!'):null,

      e('div',{style:{width:240,height:20,background:'#222',border:'2px solid #555',borderRadius:4,overflow:'hidden'}},
        e('div',{style:{width:`${muteGauge}%`,height:'100%',background:`linear-gradient(90deg,${C.safe},#22ff88)`,transition:'width 0.05s'}})
      ),
      e('div',{style:{width:240,height:8,background:'#222',border:'1px solid #333',borderRadius:2,overflow:'hidden'}},
        e('div',{style:{width:`${kakaoTimer}%`,height:'100%',background:kakaoTimer<30?C.danger:`linear-gradient(90deg,${C.accent},#ff9900)`,transition:'width 0.1s'}})
      ),
      e('div',{style:{fontFamily:PF,fontSize:6,color:kakaoTimer<30?C.danger:C.accent}},`엄마 깨기 전에 끄자! (${Math.ceil(kakaoTimer)}%)`)
    ):null,
    // Progress dots
    e('div',{style:{position:'absolute',bottom:70,left:'50%',transform:'translateX(-50%)',display:'flex',gap:3,zIndex:15}},
      Array.from({length:20}).map((_,i)=>e('div',{key:i,style:{width:6,height:6,borderRadius:'50%',background:i<=progress*19?C.safe:'rgba(255,255,255,0.15)'}}))
    ),

      snoring?'💤 지금! 탭해서 이동! 💤':'🚫 멈춰! 움직이면 들킨다! 🚫'

// ═══════════════════════════════════════
// LEVEL 2: 주방 - 아이스크림 닌자
// ═══════════════════════════════════════
function Level2({onClear,onFail}) {
  const [playerPos,setPlayerPos]=useState({x:80,y:480});
  const [momAngle,setMomAngle]=useState(180);
  const [phase,setPhase]=useState("sneak");
  const [fridgeProgress,setFridgeProgress]=useState(0);
  const [noiseGauge,setNoiseGauge]=useState(0);
  const [pressing,setPressing]=useState(false);
  const [away,setAway]=useState(false);
  const awayRef=useRef(false);
  const noiseRef=useRef(0);
  const momPos={x:300,y:300};
  const fridgePos={x:380,y:120};
  const caught=useRef(false);
  const pressingRef=useRef(false);
  const fridgeRef=useRef(0);

  useEffect(()=>{
    if(phase!=="sneak"&&phase!=="fridge")return;
    const i=setInterval(()=>{if(!awayRef.current)setMomAngle(a=>(a+1.2)%360);},30);
    return ()=>clearInterval(i);
  },[phase]);

  // 엄마가 가끔 설거지하느라 등을 돌린다 (그때가 기회!)
  useEffect(()=>{
    let t;
    const watch=()=>{awayRef.current=false;setAway(false);t=setTimeout(rest,3500+Math.random()*2000);};
    const rest=()=>{awayRef.current=true;setAway(true);t=setTimeout(watch,2200+Math.random()*1000);};
    t=setTimeout(rest,3000+Math.random()*1500);
    return ()=>clearTimeout(t);
  },[]);

  useEffect(()=>{
    if(caught.current||away||(phase!=="sneak"&&phase!=="fridge"))return;
    const dx=playerPos.x-momPos.x,dy=playerPos.y-momPos.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const angle=((Math.atan2(dy,dx)*180/Math.PI)+360)%360;
    const diff=Math.abs(angle-momAngle);
    const angleDiff=Math.min(diff,360-diff);
    if(dist<250&&angleDiff<35){caught.current=true;SFX.crash();onFail("엄마 시야에 딱 걸렸다!\n부채꼴 시야를 잘 피해서 이동해야 해!");}
  },[playerPos,momAngle,phase,away]);

  const movePlayer=useCallback((ev)=>{
    if(phase==="fridge")return;
    const rect=ev.currentTarget.getBoundingClientRect();
    const x=(ev.clientX-rect.left)/rect.width*GAME_W;
    const y=(ev.clientY-rect.top)/rect.height*GAME_H;
    setPlayerPos(p=>{
      const dx=x-p.x,dy=y-p.y,dist=Math.sqrt(dx*dx+dy*dy),speed=22;
      if(dist<speed)return{x:Math.max(20,Math.min(GAME_W-20,x)),y:Math.max(60,Math.min(GAME_H-20,y))};
      return{x:Math.max(20,Math.min(GAME_W-20,p.x+dx/dist*speed)),y:Math.max(60,Math.min(GAME_H-20,p.y+dy/dist*speed))};
    });
  },[phase]);

  useEffect(()=>{
    if(phase!=="sneak")return;
    const dx=playerPos.x-fridgePos.x,dy=playerPos.y-fridgePos.y;
    if(Math.sqrt(dx*dx+dy*dy)<45)setPhase("fridge");
  },[playerPos,phase]);

  useEffect(()=>{
    if(phase!=="fridge")return;
    const i=setInterval(()=>{
      if(pressingRef.current){
        fridgeRef.current=Math.min(fridgeRef.current+0.9,100);
        setFridgeProgress(fridgeRef.current);
        if(Math.random()<0.05)SFX.fridgeCreak();
        noiseRef.current=Math.min(noiseRef.current+1.2,100);setNoiseGauge(noiseRef.current);
        if(noiseRef.current>=100&&!caught.current){caught.current=true;onFail("냉장고를 너무 세게 열어서 소리가 났다!\n소음이 높아지면 손을 떼고 쉬었다가 열어야 해!");}
      } else {noiseRef.current=Math.max(0,noiseRef.current-0.6);setNoiseGauge(noiseRef.current);}
      if(fridgeRef.current>=100){clearInterval(i);setTimeout(()=>onClear(),400);}
    },30);
    return ()=>clearInterval(i);
  },[phase,onClear,onFail]);

  const handleDown=()=>{pressingRef.current=true;setPressing(true);};
  const handleUp=()=>{pressingRef.current=false;setPressing(false);};
  useEffect(()=>{
    window.addEventListener('mouseup',handleUp);window.addEventListener('touchend',handleUp);
    return ()=>{window.removeEventListener('mouseup',handleUp);window.removeEventListener('touchend',handleUp);};
  },[]);

  const fovLen=250,fovHalf=35;
  const rad1=(momAngle-fovHalf)*Math.PI/180;
  const rad2=(momAngle+fovHalf)*Math.PI/180;

  return e('div',{style:{width:'100%',height:'100%',background:'linear-gradient(180deg,#1a1830 0%,#252040 100%)',position:'relative',overflow:'hidden',cursor:'crosshair',userSelect:'none',touchAction:'none'},
    onClick:movePlayer,
    onMouseDown:phase==="fridge"?handleDown:undefined,onMouseUp:phase==="fridge"?handleUp:undefined,
    onTouchStart:phase==="fridge"?handleDown:undefined,onTouchEnd:phase==="fridge"?handleUp:undefined},
    // HUD
    e('div',{style:{position:'absolute',top:8,left:10,right:10,fontFamily:PF,fontSize:8,color:C.accent,zIndex:15,display:'flex',justifyContent:'space-between'}},
      e('span',null,'LEVEL 2: 주방'),e('span',null,'🍦 아이스크림 닌자')
    ),
    // Kitchen tiles
    e('div',{style:{position:'absolute',inset:0,top:50,background:"repeating-conic-gradient(rgba(255,255,255,0.03) 0% 25%, transparent 0% 50%) 0 0 / 60px 60px"}}),
    // Counter
    e('div',{style:{position:'absolute',top:50,left:0,width:200,height:GAME_H-50,background:'rgba(80,60,40,0.3)',borderRight:'3px solid rgba(255,255,255,0.1)'}}),
    // Fridge
    e('div',{style:{position:'absolute',left:fridgePos.x-28,top:fridgePos.y-45,width:56,height:90,background:phase==="fridge"?`linear-gradient(180deg,#cce8f0,${C.fridge})`:'linear-gradient(180deg,#99bbcc,#7799aa)',borderRadius:6,border:'3px solid #668899',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',boxShadow:phase==="fridge"?`0 0 30px rgba(168,216,234,0.4)`:'none'}},
      e('span',{style:{fontSize:28}},'🧊'),
      e('span',{style:{fontFamily:PF,fontSize:6,color:'#446',marginTop:2}},'냉장고'),
      phase==="fridge"?e('div',{style:{position:'absolute',top:-8,left:'50%',transform:'translateX(-50%)',width:50,height:6,background:'#333',borderRadius:3,overflow:'hidden'}},
        e('div',{style:{width:`${fridgeProgress}%`,height:'100%',background:C.safe,transition:'width 0.05s'}})
      ):null
    ),
    // FOV SVG
    e('svg',{style:{position:'absolute',inset:0,zIndex:5,pointerEvents:'none'},width:'100%',height:'100%',viewBox:`0 0 ${GAME_W} ${GAME_H}`},
      e('defs',null,e('radialGradient',{id:'fovGrad'},e('stop',{offset:'0%',stopColor:C.danger,stopOpacity:'0.35'}),e('stop',{offset:'100%',stopColor:C.danger,stopOpacity:'0.02'}))),
      away?null:e('path',{d:`M ${momPos.x} ${momPos.y} L ${momPos.x+Math.cos(rad1)*fovLen} ${momPos.y+Math.sin(rad1)*fovLen} A ${fovLen} ${fovLen} 0 0 1 ${momPos.x+Math.cos(rad2)*fovLen} ${momPos.y+Math.sin(rad2)*fovLen} Z`,fill:'url(#fovGrad)',stroke:C.danger,strokeWidth:'1',strokeOpacity:'0.3'})
    ),
    // Mom
    e('div',{style:{position:'absolute',left:momPos.x-22,top:momPos.y-22,zIndex:10,display:'flex',flexDirection:'column',alignItems:'center'}},
      e('span',{style:{fontSize:36}},'👩‍🍳'),e('span',{style:{fontFamily:PF,fontSize:6,color:away?C.safe:C.mom,marginTop:2}},away?'설거지 중~':'엄마')
    ),
    // Player
    e('div',{style:{position:'absolute',left:playerPos.x-18,top:playerPos.y-18,zIndex:10,transition:'left 0.15s, top 0.15s'}},
      e('span',{style:{fontSize:32}},'🧒')
    ),
    // Noise gauge
    phase==="fridge"?e('div',{style:{position:'absolute',bottom:50,left:'50%',transform:'translateX(-50%)',display:'flex',flexDirection:'column',alignItems:'center',gap:8,zIndex:25}},
      e('div',{style:{fontFamily:PF,fontSize:8,color:pressing?C.accent:C.white,animation:pressing?'pulse 0.3s infinite':'none'}},pressing?'끼이이익...':'꾹 눌러서 냉장고 열기! (소음 높으면 손 떼기)'),
      e('div',{style:{fontFamily:PF,fontSize:7,color:noiseGauge>60?C.danger:C.accent}},`🔊 소음: ${Math.round(noiseGauge)}%`),
      e('div',{style:{width:180,height:12,background:'#222',border:'2px solid #555',borderRadius:3,overflow:'hidden'}},
        e('div',{style:{width:`${noiseGauge}%`,height:'100%',background:noiseGauge>70?C.danger:noiseGauge>40?C.accent:C.safe,transition:'width 0.1s, background 0.3s'}})
      )
    ):null,
    phase==="sneak"?e('div',{style:{position:'absolute',bottom:25,left:'50%',transform:'translateX(-50%)',fontFamily:PF,fontSize:7,color:'rgba(255,255,255,0.5)',textAlign:'center',zIndex:15}},away?'🍳 엄마가 설거지 중! 지금이 기회!':'탭해서 이동! 빨간 시야를 피해 냉장고로!'):null
  );
}

// ═══════════════════════════════════════
// LEVEL 3: 골목길 - 스몸비 챌린지
// ═══════════════════════════════════════
function Level3({onClear,onFail}) {
  const [distance,setDistance]=useState(0);
  const maxDist=1500;
  const [playerY,setPlayerY]=useState(300);
  const [phoneGauge,setPhoneGauge]=useState(0);
  const [obstacles,setObstacles]=useState([]);
  const speed=3;
  const jumpRef=useRef(false);
  const caught=useRef(false);
  const groundY=300;
  const distRef=useRef(0);
  const phoneRef=useRef(0);
  const yRef=useRef(300);
  const needPhone=50;

  useEffect(()=>{
    const spawnInterval=90;let frame=0;
    const types=[{emoji:"🪵",label:"전신주",w:30},{emoji:"💩",label:"똥",w:24},{emoji:"👩",label:"아줌마",w:30,isDanger:true},{emoji:"🚲",label:"자전거",w:30},{emoji:"🐕",label:"강아지",w:26}];
    const i=setInterval(()=>{
      if(caught.current)return;
      frame++;
      distRef.current+=speed;
      setDistance(distRef.current);
      if(distRef.current>=maxDist){clearInterval(i);
        if(phoneRef.current>=needPhone)setTimeout(()=>onClear(),300);
        else{caught.current=true;onFail("폰 게임 레벨업을 못 했다!\n걸으면서도 폰 게임을 열심히 해야 해! 📱");}
        return;}
      setObstacles(obs=>{
        let nw=obs.map(o=>({...o,x:o.x-speed*2.2})).filter(o=>o.x>-50);
        if(frame%spawnInterval===0||(frame>300&&frame%70===0)){
          const type=types[Math.floor(Math.random()*types.length)];
          nw.push({...type,x:GAME_W+20,id:frame});
        }
        return nw;
      });
      if(jumpRef.current){yRef.current-=6;if(yRef.current<=200)jumpRef.current=false;}
      else if(yRef.current<groundY){yRef.current=Math.min(yRef.current+5,groundY);}
      setPlayerY(yRef.current);
      // 폰 게이지는 가만히 있으면 줄어든다
      phoneRef.current=Math.max(0,phoneRef.current-0.04);setPhoneGauge(phoneRef.current);
    },16);
    return ()=>clearInterval(i);
  },[onClear,onFail]);

  useEffect(()=>{
    if(caught.current)return;
    obstacles.forEach(o=>{
      if(o.x>40&&o.x<90&&playerY>260){
        caught.current=true;SFX.crash();
        if(o.isDanger)onFail("동네 아줌마한테 딱 걸렸다!\n겨리 엄마한테 바로 전화 갔다! 📞");
        else onFail(`${o.emoji} ${o.label}에 부딪혔다!\n스마트폰만 보면 안 돼!`);
      }
    });
  },[obstacles,playerY]);

  const handleJump=(ev)=>{
    const rect=ev.currentTarget.getBoundingClientRect();
    const clickY=(ev.clientY-rect.top)/rect.height;
    if(clickY>0.85){SFX.phoneTap();phoneRef.current=Math.min(phoneRef.current+4,100);setPhoneGauge(phoneRef.current);return;}
    if(yRef.current>=groundY-5&&!jumpRef.current){SFX.jump();jumpRef.current=true;}
  };

  const progress=Math.min(distance/maxDist,1);

  return e('div',{style:{width:'100%',height:'100%',background:`linear-gradient(180deg,#87CEEB 0%,#b8e4f0 40%,${C.street} 65%,${C.street} 100%)`,position:'relative',overflow:'hidden',userSelect:'none',cursor:'pointer'},onClick:handleJump},
    // HUD
    e('div',{style:{position:'absolute',top:8,left:10,right:10,fontFamily:PF,fontSize:8,color:C.dark,zIndex:15,display:'flex',justifyContent:'space-between'}},
      e('span',null,'LEVEL 3'),e('span',null,'🛹 스몸비 챌린지')
    ),
    // Clouds
    e('div',{style:{position:'absolute',top:50,fontSize:28,opacity:0.6,animation:'cloudMove 8s linear infinite',left:-40}},'☁️'),
    e('div',{style:{position:'absolute',top:80,fontSize:22,opacity:0.4,animation:'cloudMove 12s linear infinite 3s',left:-40}},'☁️'),
    // Buildings
    ...[0,1,2,3,4,5].map(i=>e('div',{key:'b'+i,style:{position:'absolute',bottom:250,left:i*90-((distance*0.3)%540),width:70,height:60+Math.sin(i*2)*30,background:`hsl(${220+i*15},20%,${30+i*5}%)`,borderRadius:'4px 4px 0 0'}})),
    // Road
    e('div',{style:{position:'absolute',bottom:80,left:0,right:0,height:180,background:C.street,borderTop:'4px solid #777'}}),
    // Road lines
    ...[0,1,2,3,4,5,6].map(i=>e('div',{key:'r'+i,style:{position:'absolute',bottom:165,left:i*100-((distance*2)%700),width:50,height:5,background:'#aaa',borderRadius:2}})),
    // Obstacles
    ...obstacles.map(o=>e('div',{key:o.id,style:{position:'absolute',left:o.x,bottom:100,fontSize:32,zIndex:8,filter:o.isDanger?'drop-shadow(0 0 8px #ff6b9d)':'none'}},
      o.emoji,
      o.isDanger?e('div',{style:{fontFamily:PF,fontSize:5,color:C.mom,textAlign:'center',position:'absolute',bottom:-12,width:50,left:-10}},'엄마친구!'):null
    )),
    // Player
    e('div',{style:{position:'absolute',left:55,bottom:GAME_H-playerY-200,fontSize:36,zIndex:10}},'🏃'),
    // Phone area
    e('div',{style:{position:'absolute',bottom:0,left:0,right:0,height:80,background:'linear-gradient(180deg,rgba(0,0,0,0.8),#111)',borderTop:'2px solid #444',display:'flex',alignItems:'center',justifyContent:'center',gap:16,zIndex:20}},
      e('div',{style:{fontFamily:PF,fontSize:7,color:C.accent}},'📱 폰게임 탭!'),
      e('div',{style:{width:140,height:16,background:'#333',border:'2px solid #555',borderRadius:4,overflow:'hidden',position:'relative'}},
        e('div',{style:{width:`${phoneGauge}%`,height:'100%',background:phoneGauge>=needPhone?`linear-gradient(90deg,${C.safe},#22ff88)`:`linear-gradient(90deg,#4488ff,${C.kid})`,transition:'width 0.05s'}}),
        e('div',{style:{position:'absolute',left:`${needPhone}%`,top:0,bottom:0,width:2,background:C.accent}})
      ),
      e('div',{style:{fontFamily:PF,fontSize:6,color:phoneGauge>=needPhone?C.safe:'rgba(255,255,255,0.5)'}},`${Math.round(phoneGauge)}% / ${needPhone}%`)
    ),
    // Progress
    e('div',{style:{position:'absolute',top:30,left:30,right:30,height:8,background:'rgba(0,0,0,0.3)',borderRadius:4,overflow:'hidden',zIndex:15}},
      e('div',{style:{width:`${progress*100}%`,height:'100%',background:`linear-gradient(90deg,${C.safe},${C.accent})`,transition:'width 0.1s'}})
    ),
    e('div',{style:{position:'absolute',top:45,left:'50%',transform:'translateX(-50%)',fontFamily:PF,fontSize:6,color:'rgba(0,0,0,0.5)',zIndex:15}},'위쪽 탭 = 점프! / 아래 폰 탭으로 게이지 50% 채우기!')
  );
}

// ═══════════════════════════════════════
// LEVEL 4: 내 방 - 완벽한 알리바이
// ═══════════════════════════════════════
function Level4({onClear,onFail}) {
  const [phase,setPhase]=useState("chill");
  const [footstepVol,setFootstepVol]=useState(0);
  const [hideProgress,setHideProgress]=useState(0);
  const [inspectTimer,setInspectTimer]=useState(0);
  const [eyeShake,setEyeShake]=useState(0);
  const [roundsCleared,setRoundsCleared]=useState(0);
  const [momClose,setMomClose]=useState(false);
  const [showComic,setShowComic]=useState(true);
  const caught=useRef(false);
  const hideRef=useRef(0),eyeRef=useRef(0);
  const targetRounds=3;

  useEffect(()=>{
    if(phase!=="chill")return;
    setShowComic(true);setFootstepVol(0);setMomClose(false);
    const approachTime=3000+Math.random()*2000;
    const t=setTimeout(()=>setPhase("alert"),approachTime);
    return ()=>clearTimeout(t);
  },[phase,roundsCleared]);

  useEffect(()=>{
    if(phase!=="alert")return;
    setShowComic(true);let vol=0;let stepCount=0;
    const i=setInterval(()=>{
      vol+=1.5;stepCount++;setFootstepVol(vol);
      if(stepCount%8===0)SFX.footstep();
      if(vol>50)setMomClose(true);
      if(vol>=100&&!caught.current){caught.current=true;onFail("폰을 못 숨기고 엄마한테 딱 걸렸다!\n발소리가 들리면 빨리 숨겨야 해!");}
    },50);
    return ()=>clearInterval(i);
  },[phase]);

  const handleTap=useCallback(()=>{
    if(phase==="alert"){
      SFX.hideTap();

// LEVEL 6: 겨리의 책장 - 주술회전 전권 모으기
//  · 시험(미니게임 1판)에 성공하면 한 권씩 (30권 중 20권 = 2/3)
//  · 나머지 10권(1/3)은 생일 선물 (시험 2권마다 생일 1번)
// ═══════════════════════════════════════
const EXAM_TASKS={
  memory:{name:"📚 암기 과목",hint:"보여주는 순서를 외워서 똑같이 누르세요!"},
  omr:{name:"✏️ OMR 마킹",hint:"연필이 목표 번호 위에 있을 때 찍으세요!"},
  sleepy:{name:"😪 졸음 참기",hint:"눈꺼풀이 내려온다! 연타해서 버티세요!"},
  order:{name:"📄 시험지 넘기기",hint:"1부터 6까지 순서대로 빠르게 누르세요!"},
};
const MEMORY_ICONS=["🔥","💧","⚡","🌿"];
function shuffleArr(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
// lvl: 지금까지 시험으로 얻은 책 수(0~19) - 클수록 어려워진다
function makeTask(type,lvl){
  if(type==="memory"){const len=lvl<7?3:lvl<14?4:5;return {type,limit:6000,showMs:1300+len*300,seq:Array.from({length:len},()=>MEMORY_ICONS[Math.floor(Math.random()*MEMORY_ICONS.length)]),choices:shuffleArr(MEMORY_ICONS)};}
  if(type==="omr")return {type,limit:6000,speed:3.0+lvl*0.13,target:1+Math.floor(Math.random()*5)};
  if(type==="order")return {type,limit:Math.max(5000,7000-lvl*80),nums:shuffleArr([1,2,3,4,5,6])};
  return {type,limit:3000,rate:1.6+lvl*0.06};
}
const PASS_LINES=['엄마: "오~ 점수 좋네! 약속대로 한 권!"','엄마: "열심히 했구나. 이번 달 만화책!"','엄마: "이 점수면 인정! 가져가~"','엄마: "와, 시험 잘 봤네?"'];
const FAIL_LINES=['엄마: "이 점수로 만화책? 안 돼!"','엄마: "다음 시험 잘 보면 생각해 볼게."','엄마: "공부는 안 하고 만화책 생각만 했지?"'];

function Level6({onClear,onFail}) {
  const TOTAL=30,MAX_FAILS=5,BIRTH_TIME=4500;
  const birthNeed=(k)=>Math.round(8+k*1.1);          // 생일 k번째(0~9) 촛불 개수
  const isGiftNext=(n)=>n%3===2;                      // 시험 2권마다 생일 선물 1권 → 시험 20권 + 선물 10권
  const [phase,setPhase]=useState("exam");
  const [vols,setVols]=useState([]);
  const [fails,setFails]=useState(0);
  const [examNo,setExamNo]=useState(1);
  const [task,setTask]=useState(null);
  const [timeBar,setTimeBar]=useState(100);
  const [feedback,setFeedback]=useState("");
  const [momLine,setMomLine]=useState("");
  const [step,setStep]=useState(0);       // memory: 입력한 개수 / order: 완료한 번호 수
  const [shown,setShown]=useState(false); // memory: 순서 보여주는 중
  const [marker,setMarker]=useState(0);   // omr: 연필 위치(0~100)
  const [lid,setLid]=useState(0);         // sleepy: 눈꺼풀 내려온 정도(0~100)
  const [taps,setTaps]=useState(0);
  const [bBar,setBBar]=useState(100);
  const [gifted,setGifted]=useState(false);
  const phaseRef=useRef("exam"),volsRef=useRef([]),failsRef=useRef(0),examNoRef=useRef(1),lastTypeRef=useRef("");
  const lockRef=useRef(false),taskRef=useRef(null);
  const stepRef=useRef(0),showRef=useRef(false),markerRef=useRef(0),dirRef=useRef(1),lidRef=useRef(0);
  const tapsRef=useRef(0),needRef=useRef(0),doneRef=useRef(false);
  const examVols=()=>volsRef.current.filter(v=>v==="exam").length;

  const nextTask=()=>{
    const types=Object.keys(EXAM_TASKS).filter(t=>t!==lastTypeRef.current);
    const type=types[Math.floor(Math.random()*types.length)];
    lastTypeRef.current=type;
    const t=makeTask(type,examVols());
    taskRef.current=t;lockRef.current=false;
    stepRef.current=0;setStep(0);markerRef.current=0;dirRef.current=1;setMarker(0);lidRef.current=0;setLid(0);
    showRef.current=t.type==="memory";setShown(showRef.current);
    setTimeBar(100);setFeedback("");setMomLine("");setTask(t);
  };
  useEffect(()=>{nextTask();},[]);

  const advance=()=>{
    if(volsRef.current.length>=TOTAL){finish();return;}
    if(isGiftNext(volsRef.current.length))startBirthday();
    else{examNoRef.current++;setExamNo(examNoRef.current);phaseRef.current="exam";setPhase("exam");nextTask();}
  };
  const finish=()=>{phaseRef.current="done";setPhase("done");SFX.fanfare();setTimeout(()=>onClear(),2000);};

  // 시험 한 번(미니게임 1개) 결과 처리
  const resolve=(ok,msg)=>{
    if(lockRef.current||phaseRef.current!=="exam")return;
    lockRef.current=true;
    const lines=ok?PASS_LINES:FAIL_LINES;
    setFeedback(msg);setMomLine(lines[Math.floor(Math.random()*lines.length)]);
    if(ok){volsRef.current=[...volsRef.current,"exam"];setVols(volsRef.current);SFX.muteSuccess();}
    else{failsRef.current++;setFails(failsRef.current);SFX.gameOver();}
    setTimeout(()=>{
      if(!ok&&failsRef.current>=MAX_FAILS){onFail("시험을 5번이나 망쳐서 만화책을 다 못 모았다!\n좋은 점수를 받아야 한 권씩 사준대!");return;}
      advance();
    },1400);
  };

  // 미니게임별 진행(50ms 틱)
  useEffect(()=>{
    if(phase!=="exam"||!task)return;
    let elapsed=0,showElapsed=0;
    const i=setInterval(()=>{
      if(lockRef.current)return;
      if(task.type==="memory"&&showRef.current){
        showElapsed+=50;
        if(showElapsed>=task.showMs){showRef.current=false;setShown(false);}
        return;
      }
      elapsed+=50;setTimeBar(Math.max(0,100-elapsed/task.limit*100));
      if(task.type==="omr"){
        let np=markerRef.current+dirRef.current*task.speed;
        if(np>=100){np=100;dirRef.current=-1;}
        if(np<=0){np=0;dirRef.current=1;}
        markerRef.current=np;setMarker(np);
      }
      if(task.type==="sleepy"){
        lidRef.current=Math.min(100,lidRef.current+task.rate);setLid(lidRef.current);
        if(lidRef.current>=100){resolve(false,"😴 잠들어 버렸다!");return;}
        if(elapsed>=task.limit){resolve(true,"😎 졸음을 이겼다!");return;}
        return;
      }
      if(elapsed>=task.limit)resolve(false,"⏰ 시간 초과!");
    },50);
    return ()=>clearInterval(i);
  },[phase,task]);

  // 입력 핸들러
  const pressMemory=(icon)=>{
    const t=taskRef.current;
    if(lockRef.current||showRef.current||!t||t.type!=="memory")return;
    SFX.phoneTap();
    if(icon===t.seq[stepRef.current]){
      stepRef.current++;setStep(stepRef.current);
      if(stepRef.current>=t.seq.length)resolve(true,"🧠 완벽하게 외웠다!");
    }else resolve(false,"❌ 순서가 틀렸다!");
  };
  const stampOmr=()=>{
    const t=taskRef.current;
    if(lockRef.current||!t||t.type!=="omr")return;
    const lo=(t.target-1)*20,hi=t.target*20;
    if(markerRef.current>=lo&&markerRef.current<=hi)resolve(true,"✏️ 정확히 마킹!");
    else resolve(false,"❌ 엉뚱한 번호에 찍었다!");
  };
  const pressSleepy=()=>{
    if(lockRef.current||!taskRef.current||taskRef.current.type!=="sleepy")return;
    SFX.hideTap();lidRef.current=Math.max(0,lidRef.current-9);setLid(lidRef.current);
  };
  const pressOrder=(n)=>{
    const t=taskRef.current;
    if(lockRef.current||!t||t.type!=="order")return;
    if(n===stepRef.current+1){
      SFX.phoneTap();stepRef.current++;setStep(stepRef.current);
      if(stepRef.current>=6)resolve(true,"📄 빠르게 다 넘겼다!");
    }else SFX.alert();
  };

  // 생일 케이크 촛불 불기
  const startBirthday=()=>{
    needRef.current=birthNeed(Math.floor(volsRef.current.length/3));
    tapsRef.current=0;doneRef.current=false;
    setTaps(0);setBBar(100);setGifted(false);setFeedback("");setMomLine("");
    phaseRef.current="birthday";setPhase("birthday");
  };
  useEffect(()=>{
    if(phase!=="birthday")return;
    let elapsed=0;
    const i=setInterval(()=>{
      if(doneRef.current)return;
      elapsed+=50;setBBar(Math.max(0,100-elapsed/BIRTH_TIME*100));
      if(elapsed>=BIRTH_TIME){doneRef.current=true;SFX.gameOver();onFail("촛불을 다 못 꺼서 소원이 날아갔다!\n생일 선물을 받으려면 촛불을 후~ 불어야 해!");}
    },50);
    return ()=>clearInterval(i);
  },[phase]);
  const blow=()=>{
    if(phaseRef.current!=="birthday"||doneRef.current)return;
    tapsRef.current++;setTaps(tapsRef.current);SFX.hideTap();
    if(tapsRef.current>=needRef.current){
      doneRef.current=true;setGifted(true);
      volsRef.current=[...volsRef.current,"gift"];setVols(volsRef.current);SFX.muteSuccess();
      setTimeout(()=>advance(),1200);
    }
  };

  const slot=(k)=>{
    const v=vols[k];
    return e('div',{key:k,style:{width:40,height:30,borderRadius:3,border:v?'2px solid #000':'1px dashed rgba(255,255,255,0.22)',background:v==="exam"?'linear-gradient(180deg,#d9453b,#8e1f1a)':v==="gift"?'linear-gradient(180deg,#ffcc00,#cc8800)':'rgba(255,255,255,0.04)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',boxShadow:v?'1px 1px 0 #000':'none',animation:v&&k===vols.length-1?'float 0.5s ease-in-out 2':'none'}},
      e('span',{style:{fontFamily:PF,fontSize:6,color:v?'#fff':'rgba(255,255,255,0.3)'}},k+1),
      e('span',{style:{fontSize:8,lineHeight:1}},v==="gift"?'🎁':v==="exam"?'💯':'')
    );
  };
  const bigBtn=(label,onClick,extra)=>e('button',{onClick,style:Object.assign({width:'100%',fontFamily:PF,fontSize:11,padding:'14px 8px',background:'linear-gradient(135deg,#3b2a66,#2a1d4d)',color:C.white,border:'2px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'2px 2px 0 #000'},extra||{})},label);

  // 미니게임 화면
  const renderTask=()=>{
    if(!task)return null;
    if(task.type==="memory"){
      if(shown)return e('div',{'data-seq':task.seq.join(''),style:{display:'flex',flexDirection:'column',alignItems:'center',gap:10,height:150,justifyContent:'center'}},
        e('div',{style:{fontFamily:PF,fontSize:9,color:C.accent,animation:'pulse 0.4s infinite'}},'외워라!'),
        e('div',{style:{display:'flex',gap:10,fontSize:task.seq.length>4?30:38}},...task.seq.map((s,k)=>e('span',{key:k},s)))
      );
      return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:12,height:150}},
        e('div',{style:{display:'flex',gap:8,fontSize:20,height:30}},...task.seq.map((s,k)=>e('span',{key:k},k<step?s:'❔'))),
        e('div',{style:{display:'flex',gap:10,width:'100%'}},...task.choices.map((c)=>e('button',{key:c,'data-icon':c,onClick:()=>pressMemory(c),style:{flex:1,fontSize:30,padding:'12px 0',background:'linear-gradient(135deg,#3b2a66,#2a1d4d)',border:'2px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'2px 2px 0 #000'}},c)))
      );
    }
    if(task.type==="omr")return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:18,height:170}},
      e('div',{style:{fontFamily:PF,fontSize:9,color:C.safe}},`🎯 목표: ${task.target}번`),
      e('div',{'data-target':task.target,'data-marker':Math.round(marker),style:{position:'relative',width:'100%',height:52,display:'flex'}},
        ...[1,2,3,4,5].map(n=>e('div',{key:n,style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',border:n===task.target?'2px solid #44ffaa':'2px solid rgba(255,255,255,0.2)',background:n===task.target?'rgba(68,255,170,0.22)':'rgba(255,255,255,0.05)',fontFamily:PF,fontSize:12,color:C.white}},n)),
        e('div',{style:{position:'absolute',left:`calc(${marker}% - 2px)`,top:-4,bottom:-4,width:4,background:C.accent,boxShadow:'0 0 8px #ffcc00',borderRadius:2}}),
        e('div',{style:{position:'absolute',left:`calc(${marker}% - 10px)`,top:-22,fontSize:16}},'✏️')
      ),
      bigBtn('✏️ 찍기!',stampOmr)
    );
    if(task.type==="sleepy")return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:10,height:150}},
      e('div',{style:{fontSize:44}},lid>70?'😴':lid>35?'🥱':'😳'),
      e('div',{style:{width:'100%',height:14,background:'#222',border:'2px solid #555',borderRadius:4,overflow:'hidden'}},
        e('div',{'data-lid':Math.round(lid),style:{width:`${lid}%`,height:'100%',background:lid>70?C.danger:lid>40?C.accent:C.safe}})
      ),
      bigBtn('👀 눈 뜨기! (연타)',pressSleepy)
    );
    return e('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,height:150}},
      ...task.nums.map(n=>e('button',{key:n,'data-n':n,onClick:()=>pressOrder(n),style:{fontFamily:PF,fontSize:16,background:n<=step?'rgba(68,255,170,0.25)':'linear-gradient(135deg,#3b2a66,#2a1d4d)',color:n<=step?'rgba(255,255,255,0.35)':C.white,border:'2px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'2px 2px 0 #000'}},n<=step?'✔':n))
    );
  };

  const nextWish=vols.length+1;
  const candlesLeft=Math.max(0,needRef.current-taps);
  const failedMsg=feedback.startsWith('❌')||feedback.startsWith('⏰')||feedback.startsWith('😴');

  return e('div',{style:{width:'100%',height:'100%',background:'linear-gradient(180deg,#1b1030 0%,#2b1b4a 55%,#3a2560 100%)',position:'relative',overflow:'hidden',userSelect:'none',cursor:phase==="birthday"?'pointer':'default'},onClick:phase==="birthday"?blow:undefined},
    e('div',{style:{position:'absolute',top:8,left:10,right:10,fontFamily:PF,fontSize:8,color:C.accent,zIndex:15,display:'flex',justifyContent:'space-between'}},
      e('span',null,'LEVEL 6: 겨리의 책장'),e('span',null,`📕 주술회전 ${vols.length}/${TOTAL}`)
    ),
    // 책장 (30권)
    e('div',{style:{position:'absolute',top:28,left:0,right:0,display:'flex',flexWrap:'wrap',justifyContent:'center',gap:3,padding:'6px 22px',borderBottom:'6px solid #5a4a3a',background:'rgba(0,0,0,0.25)'}},
      ...Array.from({length:TOTAL}).map((_,k)=>slot(k))
    ),
    e('div',{style:{position:'absolute',top:140,left:0,right:0,textAlign:'center',fontFamily:PF,fontSize:6,color:'rgba(255,255,255,0.55)',lineHeight:1.9}},'💯 시험 성공하면 한 권씩 (20권)  ·  🎁 생일 선물 (10권)'),

    // ── 시험 (미니게임 1판 = 책 1권) ──
    phase==="exam"&&task?e('div',{style:{position:'absolute',top:166,left:20,right:20,display:'flex',flexDirection:'column',alignItems:'center',gap:8}},
      e('div',{style:{width:'100%',display:'flex',justifyContent:'space-between',fontFamily:PF,fontSize:8,color:C.white}},
        e('span',null,`📝 ${examNo}번째 시험`),
        e('span',{style:{color:fails>=MAX_FAILS-1?C.danger:C.accent}},`실패 ${fails}/${MAX_FAILS}`)
      ),
      e('div',{style:{width:'100%',padding:'10px',background:'rgba(255,255,255,0.08)',border:'2px solid rgba(255,255,255,0.2)',borderRadius:8,textAlign:'center',lineHeight:1.9}},
        e('div',{style:{fontFamily:PF,fontSize:11,color:C.white}},EXAM_TASKS[task.type].name),
        e('div',{style:{fontFamily:PF,fontSize:7,color:'rgba(255,255,255,0.65)'}},EXAM_TASKS[task.type].hint)
      ),
      e('div',{style:{width:'100%',height:8,background:'#222',border:'1px solid #444',borderRadius:3,overflow:'hidden'}},
        e('div',{style:{width:`${timeBar}%`,height:'100%',background:timeBar<30?C.danger:C.accent}})
      ),
      e('div',{style:{width:'100%'}},renderTask()),
      e('div',{style:{fontFamily:PF,fontSize:10,height:14,color:failedMsg?C.danger:C.safe}},feedback),
      e('div',{style:{fontFamily:PF,fontSize:7,height:14,color:C.mom,textAlign:'center'}},momLine)
    ):null,

    // ── 생일 ──
    phase==="birthday"?e('div',{style:{position:'absolute',top:166,left:20,right:20,display:'flex',flexDirection:'column',alignItems:'center',gap:10}},
      e('div',{style:{fontFamily:PF,fontSize:9,color:C.accent}},`🎂 ${Math.floor(vols.length/3)+(gifted?0:1)}번째 생일`),
      e('div',{style:{fontFamily:PF,fontSize:7,color:C.mom,textAlign:'center',lineHeight:2.1}},`엄마: "겨리야, 생일 선물 뭐 받고 싶니?"`,e('br'),e('span',{style:{color:C.kid}},`겨리: "주술회전 ${gifted?vols.length:nextWish}권이요!!"`)),
      e('div',{style:{fontSize:56,animation:gifted?'float 0.6s ease-in-out infinite':'none'}},gifted?'🎁':'🎂'),
      e('div',{style:{fontSize:16,height:24,letterSpacing:1,textAlign:'center',lineHeight:1.2}},gifted?'':'🕯️'.repeat(candlesLeft)),
      e('div',{style:{fontFamily:PF,fontSize:9,color:gifted?C.safe:C.white,animation:gifted?'none':'pulse 0.5s infinite'}},gifted?`🎁 주술회전 ${vols.length}권 선물 받음!`:'후~ 후~ 연타해서 촛불 끄기!'),
      e('div',{style:{width:'100%',height:14,background:'#222',border:'2px solid #555',borderRadius:4,overflow:'hidden'}},
        e('div',{style:{width:`${Math.min(100,taps/Math.max(1,needRef.current)*100)}%`,height:'100%',background:`linear-gradient(90deg,${C.accent},${C.safe})`,transition:'width 0.05s'}})
      ),
      e('div',{style:{width:'100%',height:6,background:'#222',borderRadius:3,overflow:'hidden'}},
        e('div',{style:{width:`${bBar}%`,height:'100%',background:bBar<30?C.danger:C.mom}})
      )
    ):null,

    // ── 완성 ──
    phase==="done"?e('div',{style:{position:'absolute',top:180,left:20,right:20,display:'flex',flexDirection:'column',alignItems:'center',gap:14}},
      e('div',{style:{fontSize:56,animation:'float 1s ease-in-out infinite'}},'📚'),
      e('div',{style:{fontFamily:PF,fontSize:13,color:C.accent,textShadow:'2px 2px 0 #000'}},'책장 완성!'),
      e('div',{style:{fontFamily:PF,fontSize:8,color:C.white,textAlign:'center',lineHeight:2.2}},'주술회전 30권 전권 수집 성공!',e('br'),e('span',{style:{color:C.mom}},'엄마: "...이제 공부도 열심히 하자?"'))
    ):null
  );
}

// ═══════════════════════════════════════
// LEVEL 7: 엄마의 비밀 작전 - 생일 전날 밤 서프라이즈 (이번엔 엄마가 주인공!)
//  · 꾹 눌러서 장식하면 소음이 오른다 (소음 100% → 아이가 깬다)
//  · 아이가 물 마시러 / 렌즈 끼러 나오기 전 "끼이익" 경고 → 불 끄고 숨기
// ═══════════════════════════════════════
function Level7({onClear,onFail}) {
  const ITEMS=[
    {emoji:"🎈",name:"풍선 불기",noise:1.5},
    {emoji:"🎊",name:"가랜드 걸기",noise:1.0},
    {emoji:"🎉",name:"현수막 달기",noise:1.0},
    {emoji:"🎁",name:"선물 쌓기",noise:0.8},
    {emoji:"🍰",name:"케이크 세팅",noise:0.8},
    {emoji:"✨",name:"별조명 켜기",noise:0.6},
  ];
  const TOTAL=ITEMS.length,RATE=1.6,LIMIT=150000,DOOR_X=8,SPEED=1.6;
  const TRIPS={
    water:{x:88,icon:"🚰",label:"물 마시러 나왔다… 💧",bubble:"목말라…"},
    lens:{x:62,icon:"🚻",label:"렌즈 다시 끼러 나왔다… 👓",bubble:"렌즈 다시 껴야 해…"},
  };
  const [done,setDone]=useState(0);
  const [prog,setProg]=useState(0);
  const [noise,setNoise]=useState(0);
  const [hidden,setHidden]=useState(false);
  const [holding,setHolding]=useState(false);
  const [child,setChild]=useState({phase:"sleep",type:"water",x:DOOR_X});
  const [timeBar,setTimeBar]=useState(100);
  const [finished,setFinished]=useState(false);
  const doneRef=useRef(0),progRef=useRef(0),noiseRef=useRef(0),hiddenRef=useRef(false),holdRef=useRef(false);
  const childRef=useRef({phase:"sleep",type:"water",x:DOOR_X,t:0,dir:"to"});
  const cooldownRef=useRef(7000),endedRef=useRef(false);

  const caught=()=>{
    if(endedRef.current)return;
    endedRef.current=true;SFX.crash();
    onFail("들켜 버렸다!\n겨리가 장식을 봐 버렸다... 서프라이즈 대실패!");
  };
  const startEvent=(kind)=>{
    const c=childRef.current;
    const type=kind==="noise"?(Math.random()<0.5?"water":"lens"):kind;
    c.phase="warn";c.type=type;c.x=DOOR_X;c.dir="to";
    c.t=kind==="noise"?700:Math.max(1000,1500-doneRef.current*80);
    SFX.fridgeCreak();
  };
  const endEvent=()=>{
    const c=childRef.current;c.phase="sleep";c.x=DOOR_X;
    cooldownRef.current=Math.max(4500,9000-doneRef.current*700)+Math.random()*2500;
  };

  useEffect(()=>{
    let elapsed=0,tick=0;
    const i=setInterval(()=>{
      if(endedRef.current)return;
      tick++;elapsed+=50;
      setTimeBar(Math.max(0,100-elapsed/LIMIT*100));
      if(elapsed>=LIMIT){endedRef.current=true;SFX.gameOver();onFail("해가 떠 버렸다!\n겨리가 일어나기 전에 장식을 끝내야 해!");return;}

      // 장식 + 소음
      const item=ITEMS[Math.min(doneRef.current,TOTAL-1)];
      if(holdRef.current&&!hiddenRef.current){
        progRef.current+=RATE;noiseRef.current=Math.min(100,noiseRef.current+item.noise);
        if(tick%4===0)SFX.phoneTap();
        if(progRef.current>=100){
          doneRef.current++;progRef.current=0;setDone(doneRef.current);SFX.muteSuccess();
          if(doneRef.current>=TOTAL){
            endedRef.current=true;setFinished(true);holdRef.current=false;setHolding(false);
            setTimeout(()=>{SFX.fanfare();},200);setTimeout(()=>onClear(),2600);return;
          }
        }
      } else noiseRef.current=Math.max(0,noiseRef.current-0.9);
      setProg(progRef.current);setNoise(noiseRef.current);

      // 아이
      const c=childRef.current;
      if(c.phase==="sleep"){
        if(noiseRef.current>=100){noiseRef.current=40;startEvent("noise");}
        else{cooldownRef.current-=50;if(cooldownRef.current<=0)startEvent(Math.random()<0.25?"peek":Math.random()<0.5?"water":"lens");}
      } else if(c.phase==="warn"){
        c.t-=50;
        if(c.t<=0){
          if(!hiddenRef.current){caught();return;}
          if(c.type==="peek"){c.phase="peek";c.t=1500;}
          else{c.phase="out";c.dir="to";}
        }
      } else if(c.phase==="peek"){
        if(!hiddenRef.current){caught();return;}
        c.t-=50;if(c.t<=0)endEvent();
      } else if(c.phase==="out"){
        if(!hiddenRef.current){caught();return;}
        const tx=TRIPS[c.type].x;
        if(c.dir==="to"){c.x=Math.min(tx,c.x+SPEED);if(c.x>=tx){c.dir="stay";c.t=1200;}}
        else if(c.dir==="stay"){c.t-=50;if(c.t<=0)c.dir="back";}
        else{c.x=Math.max(DOOR_X,c.x-SPEED);if(c.x<=DOOR_X)endEvent();}
        if(tick%6===0)SFX.footstep();
      }
      setChild({phase:c.phase,type:c.type,x:c.x});
    },50);
    return ()=>clearInterval(i);
  },[]);

  const setHold=(v)=>{holdRef.current=v&&!hiddenRef.current&&!endedRef.current;setHolding(holdRef.current);};
  const toggleHide=()=>{
    if(endedRef.current)return;
    if(hiddenRef.current){
      const ph=childRef.current.phase;
      if(ph==="out"||ph==="peek"){caught();return;}   // 아직 겨리가 나와 있는데 나오면 들킨다
      hiddenRef.current=false;setHidden(false);SFX.click();
    } else {
      hiddenRef.current=true;setHidden(true);holdRef.current=false;setHolding(false);SFX.sneak();
    }
  };
  useEffect(()=>{
    const up=()=>{holdRef.current=false;setHolding(false);};
    window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    return ()=>{window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};
  },[]);

  const cur=ITEMS[Math.min(done,TOTAL-1)];
  const warn=child.phase==="warn",out=child.phase==="out",peek=child.phase==="peek";
  const trip=TRIPS[child.type]||TRIPS.water;
  const status=finished?"🎉 서프라이즈 완성!":warn?"⚠️ 방문이 열린다!! 빨리 숨어!!":peek?"👀 겨리가 문틈으로 둘러본다…":out?`🧒 ${trip.label}`:hidden?"🤫 숨어 있는 중… (겨리 방 문 닫힘)":"😴 겨리는 쿨쿨 자는 중";
  const statusColor=finished?C.safe:(warn||peek||out)?C.danger:C.safe;

  return e('div',{'data-child':child.phase,'data-hidden':hidden?'1':'0','data-done':done,style:{width:'100%',height:'100%',background:'linear-gradient(180deg,#0e1330 0%,#1b2147 60%,#2a2a52 100%)',position:'relative',overflow:'hidden',userSelect:'none',touchAction:'none'}},
    e('div',{style:{position:'absolute',top:8,left:10,right:10,fontFamily:PF,fontSize:8,color:C.accent,zIndex:15,display:'flex',justifyContent:'space-between'}},
      e('span',null,'LEVEL 7: 생일 전날 밤'),e('span',null,'🎂 엄마의 비밀 작전')
    ),
    // 새벽까지 남은 시간
    e('div',{style:{position:'absolute',top:26,left:10,right:10,height:6,background:'rgba(255,255,255,0.12)',borderRadius:3,overflow:'hidden',zIndex:15}},
      e('div',{style:{width:`${timeBar}%`,height:'100%',background:timeBar<25?C.danger:'linear-gradient(90deg,#6c7bff,#ffcc00)'}})
    ),
    // 장식 슬롯 (거실 벽)
    e('div',{style:{position:'absolute',top:46,left:70,right:14,display:'flex',justifyContent:'space-around'}},
      ...ITEMS.map((it,k)=>e('div',{key:k,style:{width:44,height:52,borderRadius:6,border:k<done?'2px solid #ffcc00':k===done?'2px dashed #44ffaa':'2px dashed rgba(255,255,255,0.2)',background:k<done?'rgba(255,204,0,0.15)':'rgba(255,255,255,0.04)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,animation:k===done-1?'float 0.6s ease-in-out 2':'none'}},k<done?it.emoji:e('span',{style:{opacity:0.25,fontSize:20}},it.emoji)))
    ),
    // 겨리 방 문
    e('div',{style:{position:'absolute',left:10,top:120,width:56,height:116,background:warn||peek?'linear-gradient(180deg,#a68b4a,#80642a)':'linear-gradient(180deg,#6a5a3a,#5a4a2a)',borderRadius:4,border:'2px solid #4a3a2a',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',boxShadow:warn?'0 0 26px rgba(255,204,0,0.85)':peek?'0 0 18px rgba(255,204,0,0.5)':'none',animation:warn?'shake 0.25s infinite':'none'}},
      e('span',{style:{fontSize:28}},peek?'👀':warn?'🚪':'🚪'),
      e('span',{style:{fontFamily:PF,fontSize:6,color:'#fff',marginTop:4}},'겨리 방')
    ),
    warn?e('div',{style:{position:'absolute',left:72,top:130,fontFamily:PF,fontSize:9,color:C.danger,animation:'pulse 0.3s infinite'}},'끼이익…'):null,
    // 화장실 / 주방
    e('div',{style:{position:'absolute',left:'62%',top:150,transform:'translateX(-50%)',textAlign:'center',opacity:(out&&child.type==='lens')?1:0.55}},e('div',{style:{fontSize:30}},'🚻'),e('div',{style:{fontFamily:PF,fontSize:6,color:'#ccd'}},'화장실')),
    e('div',{style:{position:'absolute',left:'88%',top:150,transform:'translateX(-50%)',textAlign:'center',opacity:(out&&child.type==='water')?1:0.55}},e('div',{style:{fontSize:30}},'🚰'),e('div',{style:{fontFamily:PF,fontSize:6,color:'#ccd'}},'주방')),
    // 복도 바닥선
    e('div',{style:{position:'absolute',left:0,right:0,top:240,height:3,background:'rgba(255,255,255,0.12)'}}),
    // 겨리
    out?e('div',{style:{position:'absolute',left:`${child.x}%`,top:196,transform:'translateX(-50%)',textAlign:'center',zIndex:6}},
      e('div',{style:{fontFamily:PF,fontSize:6,color:C.kid,whiteSpace:'nowrap',marginBottom:2}},trip.bubble),
      e('div',{style:{fontSize:38}},'🧒')
    ):null,
    // 엄마
    e('div',{style:{position:'absolute',left:'46%',top:262,transform:'translateX(-50%)',textAlign:'center',zIndex:6}},
      e('div',{style:{fontSize:hidden?26:40}},hidden?'🤫':'👩'),
      e('div',{style:{fontFamily:PF,fontSize:6,color:C.mom}},hidden?'소파 뒤에 숨는 중':'엄마')
    ),
    e('div',{style:{position:'absolute',left:'12%',top:268,fontSize:36,zIndex:5}},'🛋️'),
    // 불 끄면 어두워짐
    hidden?e('div',{style:{position:'absolute',inset:0,background:'rgba(0,0,0,0.62)',zIndex:7,pointerEvents:'none'}}):null,
    hidden?e('div',{style:{position:'absolute',top:298,left:0,right:0,textAlign:'center',fontFamily:PF,fontSize:7,color:'#ffcc00',zIndex:8}},'🔦 불 끔'):null,
    // 상태
    e('div',{style:{position:'absolute',top:318,left:0,right:0,textAlign:'center',fontFamily:PF,fontSize:9,color:statusColor,zIndex:9,animation:(warn||peek)?'pulse 0.35s infinite':'none'}},status),
    // 게이지
    e('div',{style:{position:'absolute',top:350,left:24,right:24,zIndex:9,display:'flex',flexDirection:'column',gap:7}},
      e('div',{style:{display:'flex',justifyContent:'space-between',fontFamily:PF,fontSize:7,color:C.white}},e('span',null,`${cur.emoji} ${finished?'완성!':cur.name}`),e('span',null,`${Math.min(done,TOTAL)}/${TOTAL}`)),
      e('div',{style:{height:12,background:'#222',border:'2px solid #555',borderRadius:4,overflow:'hidden'}},e('div',{style:{width:`${finished?100:prog}%`,height:'100%',background:`linear-gradient(90deg,${C.accent},${C.safe})`}})),
      e('div',{style:{fontFamily:PF,fontSize:7,color:noise>70?C.danger:C.accent}},`🔊 소음 ${Math.round(noise)}%  (가득 차면 겨리가 깬다!)`),
      e('div',{style:{height:8,background:'#222',border:'2px solid #555',borderRadius:4,overflow:'hidden'}},e('div',{'data-noise':Math.round(noise),style:{width:`${noise}%`,height:'100%',background:noise>70?C.danger:noise>40?C.accent:C.safe}}))
    ),
    // 버튼
    e('div',{style:{position:'absolute',bottom:22,left:20,right:20,display:'flex',gap:12,zIndex:10}},
      e('button',{'data-act':'decorate',disabled:hidden||finished,onPointerDown:(ev)=>{ev.preventDefault();setHold(true);},style:{flex:1.4,touchAction:'none',fontFamily:PF,fontSize:10,padding:'18px 6px',background:holding?'linear-gradient(135deg,#ffcc00,#ff9900)':'linear-gradient(135deg,#3b2a66,#2a1d4d)',color:holding?C.dark:C.white,border:'3px solid #000',borderRadius:8,cursor:'pointer',boxShadow:'3px 3px 0 #000',opacity:hidden?0.4:1}},holding?'🎈 꾸미는 중…':'🎈 꾹 눌러 장식하기'),
      e('button',{'data-act':'hide',disabled:finished,onClick:toggleHide,style:{flex:1,fontFamily:PF,fontSize:10,padding:'18px 6px',background:hidden?'linear-gradient(135deg,#44ffaa,#22cc88)':'linear-gradient(135deg,#7a2b46,#4d1a2e)',color:hidden?C.dark:C.white,border:'3px solid #000',borderRadius:8,cursor:'pointer',boxShadow:'3px 3px 0 #000'}},hidden?'🙈 나가기':'🙈 숨기')
    ),
    // 완성 연출
    finished?e('div',{style:{position:'absolute',inset:0,zIndex:20,background:'rgba(10,8,30,0.82)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14}},
      e('div',{style:{fontSize:60,animation:'float 1s ease-in-out infinite'}},'🎂'),
      e('div',{style:{fontFamily:PF,fontSize:13,color:C.accent,textShadow:'2px 2px 0 #000'}},'서프라이즈 완성!'),
      e('div',{style:{fontFamily:PF,fontSize:8,color:C.white,textAlign:'center',lineHeight:2.4}},'🧒 겨리: (쿨쿨… 아무것도 모른다)',e('br'),e('span',{style:{color:C.mom}},'👩 엄마: "생일 축하해, 우리 아들 💝"'))
    ):null
  );
}

// ─── ENDING ───
function Ending({onRestart,fails}) {
  return e('div',{style:{width:'100%',height:'100%',background:`radial-gradient(ellipse at 50% 30%,#2a2050,${C.bg})`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:30}},
    e('div',{style:{fontSize:64,animation:'float 2s ease-in-out infinite'}},'🏆'),
    e('div',{style:{fontFamily:PF,fontSize:15,color:C.accent,textShadow:'2px 2px 0 #000, 0 0 20px rgba(255,204,0,0.4)'}},'GAME CLEAR!'),
    e('div',{style:{fontFamily:PF,fontSize:8,color:C.white,textAlign:'center',lineHeight:2.5,maxWidth:350,marginTop:8}},
      '겨리가 엄마의 잔소리를 뚫고',e('br'),'자유를 쟁취했다!',e('br'),
      e('span',{style:{color:C.mom}},'...내일도 잔소리는 계속된다 😅'),e('br'),
      e('span',{style:{color:C.safe}},'(그 잔소리 뒤엔, 몰래 생일을 준비하는 엄마가 있었다 🎂)')
    ),
    e('div',{style:{display:'flex',gap:12,marginTop:12,fontSize:28}},...['📱','🍦','🛹','📖','🍜','📕','🎂','⭐'].map((s,i)=>e('span',{key:i},s))),
    e('div',{style:{fontFamily:PF,fontSize:7,color:'rgba(255,255,255,0.6)',marginTop:12}},fails>0?`이번 판에 들킨 횟수: ${fails}번 😱`:'한 번도 안 들켰다! 🥷 완벽!'),
    e('button',{onClick:()=>{SFX.click();onRestart();},style:{marginTop:16,fontFamily:PF,fontSize:10,padding:'12px 32px',background:`linear-gradient(135deg,${C.accent},#ff9900)`,color:C.dark,border:'3px solid #000',borderRadius:6,cursor:'pointer',boxShadow:'3px 3px 0 #000'}},'처음부터 다시!')
  );
}

// ─── MAIN ───
const LAST_LEVEL=7;
const levelData=[
  {title:"스마트폰 서리 작전",desc:"엄마가 코 골 때만 움직여!\n폰을 집으면 카톡 알림이... 무음 버튼 연타!",emoji:"📱"},
  {title:"아이스크림 닌자",desc:"엄마의 부채꼴 시야를 피해 냉장고로!\n엄마가 설거지할 때가 기회!\n소음이 높으면 손을 떼고 쉬었다 열어!",emoji:"🍦"},
  {title:"스몸비 챌린지",desc:"위쪽 탭 = 장애물 점프!\n아래쪽 폰 탭 = 게임 진행!\n게이지는 계속 줄어들어, 도착 전 50% 이상!\n아줌마를 조심해!",emoji:"🛹"},
  {title:"완벽한 알리바이",desc:"발소리가 들리면 탭해서 폰 숨기기!\n엄마 검사 중엔 절대 터치 금지!\n3라운드 버티면 성공!",emoji:"📚"},
  {title:"한밤의 라면 작전",desc:"엄마 잠든 새벽, 몰래 라면 끓이기!\n흰 선이 초록 구간에 올 때 탭!\n실수 3번이면 엄마가 깬다!",emoji:"🍜"},
  {title:"주술회전 책장 채우기",desc:"시험 미니게임에 성공하면 엄마가 한 권씩! (20권)\n시험 2번마다 생일! 촛불을 불고 선물로 한 권! (10권)\n주술회전 30권 완성! (시험 5번 망치면 실패)",emoji:"📕"},
  {title:"엄마의 비밀 작전",desc:"생일 전날 밤, 이번엔 엄마가 주인공!\n꾹 눌러 장식하되 소음이 가득 차면 안 돼!\n겨리 방문이 열리면 불 끄고 숨어!\n(렌즈 끼러, 물 마시러 나올 거야...)",emoji:"🎂"},
];
const momLines=[
  ['엄마: "겨리 너 지금 폰 만졌니?!"','엄마: "한밤중에 뭐 하는 거야!"','엄마: "그 폰 이리 내놔!"'],
  ['엄마: "냉장고 앞에서 뭐 하니? 밥 먹었잖아!"','엄마: "아이스크림은 내일 먹어!"','엄마: "겨리 너 거기 서!"'],
  ['엄마: "걸으면서 폰 보지 말랬지!!"','엄마: "겨리 너 이리 와봐!!!"','엄마: "앞을 보고 걸어야지!"'],
  ['엄마: "공부한다더니 이게 뭐니?!"','엄마: "겨리 너 숙제는 했니?!"','엄마: "폰 이리 내!"'],
  ['엄마: "이 밤에 웬 라면 냄새야?!"','엄마: "겨리 너 야식 먹니?!"','엄마: "엄마도 한 입만... 아니 안 돼!"'],
  ['엄마: "만화책은 점수 좋을 때만이라고 했지?"','엄마: "생일 선물은 소원을 제대로 빌어야지!"','엄마: "겨리 너 공부는 언제 할래?"'],
  ['겨리: "엄마...? 거실에서 뭐 해?"','겨리: "어? 풍선이다...! 헉, 내 생일?!"','겨리: "엄마! 나 물 마시러 나왔는데 이게 다 뭐야?!"'],
];
const Levels=[Level1,Level2,Level3,Level4,Level5,Level6,Level7];

function Game() {
  const [screen,setScreen]=useState("title");
  const [level,setLevel]=useState(1);
  const [failReason,setFailReason]=useState("");
  const [failQuote,setFailQuote]=useState("");
  const [key,setKey]=useState(0);
  const [paused,setPaused]=useState(false);
  const [muted,setMuted]=useState(()=>Store.get('iwf_muted',false));
  const [stats,setStats]=useState(()=>Store.get('iwf_stats',{best:0,fails:0,clears:0}));
  const [runFails,setRunFails]=useState(0);
  const playing=useRef(false);
  const frameRef=useRef(null);
  const [scale,setScale]=useState(1);   // 480x600 논리 화면을 실제 프레임 크기에 맞추는 배율
  const levelRef=useRef(1);
  const statsRef=useRef(stats);
  levelRef.current=level;

  const saveStats=(fn)=>{const ns=fn(statsRef.current);statsRef.current=ns;setStats(ns);Store.set('iwf_stats',ns);};

  useEffect(()=>{
    const el=frameRef.current;if(!el)return;
    const update=()=>setScale(el.clientWidth/GAME_W);
    update();
    if(typeof ResizeObserver==='undefined'){window.addEventListener('resize',update);return ()=>window.removeEventListener('resize',update);}
    const ro=new ResizeObserver(update);ro.observe(el);
    return ()=>ro.disconnect();
  },[]);
  useEffect(()=>{SFX.setMuted(muted);Store.set('iwf_muted',muted);},[muted]);
  useEffect(()=>{if(paused)Clock.pause();else Clock.resume();},[paused]);
  useEffect(()=>{if(screen!=="play")setPaused(false);},[screen]);
  useEffect(()=>{
    const onHide=()=>{if(document.hidden&&playing.current)setPaused(true);};
    document.addEventListener('visibilitychange',onHide);
    return ()=>document.removeEventListener('visibilitychange',onHide);
  },[]);

  const startGame=()=>{setLevel(1);setRunFails(0);setScreen("intro");};
  const startLevel=()=>{setKey(k=>k+1);playing.current=true;setScreen("play");};
  // 클리어/실패는 한 판에 한 번만 처리 (중복 호출·경합 방지)
  const onClear=useCallback(()=>{
    if(!playing.current)return;playing.current=false;
    SFX.stageClear();saveStats(s=>({...s,best:Math.max(s.best,levelRef.current)}));setScreen("clear");
  },[]);
  const onFail=useCallback((reason)=>{
    if(!playing.current)return;playing.current=false;
    const lines=momLines[levelRef.current-1];
    SFX.gameOver();setFailReason(reason);setFailQuote(lines[Math.floor(Math.random()*lines.length)]);
    setRunFails(f=>f+1);saveStats(s=>({...s,fails:s.fails+1}));setScreen("fail");
  },[]);
  const nextLevel=()=>{
    if(level>=LAST_LEVEL){SFX.fanfare();saveStats(s=>({...s,clears:s.clears+1}));setScreen("ending");}
    else{setLevel(l=>l+1);setScreen("intro");}
  };
  const retry=()=>setScreen("intro");
  const goTitle=()=>{playing.current=false;setPaused(false);setScreen("title");};

  const LevelComp=Levels[level-1];
  const btn=(label,onClick)=>e('button',{onClick,style:{fontFamily:PF,fontSize:8,padding:'8px 10px',background:C.bgLight,color:C.white,border:'2px solid #000',borderRadius:5,cursor:'pointer',boxShadow:'2px 2px 0 #000'}},label);

  return e('div',{className:'frame'},
    e('div',{ref:frameRef,style:{width:'100%',aspectRatio:`${GAME_W}/${GAME_H}`,position:'relative',overflow:'hidden',borderRadius:12,boxShadow:'0 8px 40px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,255,255,0.1)',fontFamily:'sans-serif'}},
      e('div',{style:{width:GAME_W,height:GAME_H,position:'absolute',top:0,left:0,transformOrigin:'0 0',transform:`scale(${scale})`}},
        screen==="title"?e(TitleScreen,{onStart:startGame,stats}):null,
        screen==="intro"?e(LevelIntro,{level,title:levelData[level-1].title,desc:levelData[level-1].desc,emoji:levelData[level-1].emoji,onStart:startLevel}):null,
        screen==="play"?e(LevelComp,{key:key,onClear,onFail}):null,
        screen==="clear"?e(LevelClear,{level,onNext:nextLevel}):null,
        screen==="fail"?e(GameOver,{reason:failReason,quote:failQuote,onRetry:retry}):null,
        screen==="ending"?e(Ending,{onRestart:startGame,fails:runFails}):null
      ),
      paused?e('div',{style:{position:'absolute',inset:0,zIndex:200,background:'rgba(13,10,20,0.85)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}},
        e('div',{style:{fontSize:44}},'⏸'),
        e('div',{style:{fontFamily:PF,fontSize:13,color:C.accent}},'일시정지'),
        btn('▶ 계속하기',()=>setPaused(false)),
        btn('🏠 처음으로',goTitle)
      ):null
    ),
    e('div',{style:{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8}},
      screen==="play"?btn(paused?'▶ 계속':'⏸ 일시정지',()=>setPaused(p=>!p)):null,
      btn(muted?'🔇 소리 꺼짐':'🔊 소리 켜짐',()=>setMuted(m=>!m))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(Game));
})();
</script>
</body>
</html>
